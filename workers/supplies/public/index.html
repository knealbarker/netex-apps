<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Supplies</title>
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0f1420">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/count/form.css">
  <link rel="stylesheet" href="/supplies.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <a class="brand" href="#/shuttle" aria-label="Supplies home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor" stroke="none"/><path d="M9 12.5 16 9l7 3.5v8L16 24l-7-3.5zM9 12.5l7 3.5 7-3.5M16 16v8" fill="none" stroke="var(--bg)" stroke-width="2.2"/></svg>
      <span class="brand-text"><b>Supplies</b><small id="today"></small></span>
    </a>
    <nav class="tabs" id="nav" aria-label="Sections">
      <a href="#/shuttle" data-view="shuttle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg><span>Shuttle</span></a>
      <a href="#/orders" data-view="orders"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h2l2 10h10l2-7H7"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg><span>Orders</span></a>
      <a href="#/counts" data-view="counts"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v3H8zM6 5.5H5v15h14v-15h-1M8.5 12l2 2 4-4M8.5 17h7"/></svg><span>Counts</span></a>
      <a href="#/items" data-view="items"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8 12 4l8 4v8l-8 4-8-4zM4 8l8 4 8-4M12 12v8"/></svg><span>Supply list</span></a>
      <a href="#/setup" data-view="setup"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg><span>Setup</span></a>
    </nav>
    <div class="top-right">
      <div class="menu-wrap">
        <button class="avatar" id="meBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="meMenu" title="Account"></button>
        <div class="menu" id="meMenu" role="menu" hidden>
          <div class="menu-head"><b id="meName"></b><span id="meEmail"></span><span class="chip" id="meRole"></span></div>
          <a role="menuitem" href="#/users" id="usersLink" hidden>Users &amp; access</a>
          <a role="menuitem" href="/count/" target="_blank" rel="noopener">Open the count page ↗</a>
          <button role="menuitem" id="themeBtn" type="button">Theme: <span id="themeName">System</span></button>
          <a role="menuitem" href="/cdn-cgi/access/logout">Sign out</a>
        </div>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1"><div class="loading" aria-live="polite"><span class="spin"></span>Loading…</div></main>
  <div id="print" class="print-area" aria-hidden="true"></div>
  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <noscript><p class="noscript">Supplies needs JavaScript turned on.</p></noscript>
</body>
</html>

name = "netex-sync"
main = "src/index.js"
workers_dev = false   # no public *.workers.dev address; nothing here is reachable from the internet
compatibility_date = "2026-09-01"
account_id = "61c6ba95bfea0222857214634869b20a"

# */10 = live SMRT sync (work days, LIVE_START_HOUR-LIVE_END_HOUR local); */15 = history (overnight on work days, all day on days off)
[triggers]
crons = ["*/10 * * * *", "*/15 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "netex-apps"
database_id = "1657081e-9193-4636-a12b-88e0f1f86438"
migrations_dir = "../../db/migrations"

[vars]
TIMEZONE = "America/Chicago"
SMRT_URL = "https://towncountryclean.smrtapp.com/graphql"
ORG_ID = "tcc"
SMRT_INTEGRATION_ID = "smrt"
BACKFILL_START_HOUR = "20"
BACKFILL_END_HOUR = "5"
BACKFILL_DAYS_PER_RUN = "2"
BACKFILL_OLDEST_DAY = "2021-01-01"
LIVE_START_HOUR = "4"
LIVE_END_HOUR = "21"
RIPPLING_INTEGRATION_ID = "rippling"
FORWARD_TO = "neal@towncountryclean.com"   # emails to reports@ that aren't a readable Rippling export are forwarded here

# Secret (set once in the Cloudflare dashboard: Workers > netex-sync > Settings > Variables and Secrets):
#   SMRT_KEY  - the SMRT API key. Never put it in this file or in GitHub.

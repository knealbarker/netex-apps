name = "netex-retailview"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "61c6ba95bfea0222857214634869b20a"
workers_dev = false    # only reachable at retailview.netexcleaners.com, behind Cloudflare Access
preview_urls = false

routes = [{ pattern = "retailview.netexcleaners.com", custom_domain = true }]

# every 10 minutes: the wrong-store text (Settings › Counter); the summary email goes out once a day at the hour set in Settings
[triggers]
crons = ["*/10 * * * *"]

# Texts (netex-sms): sends the wrong-store text to the retail manager
[[services]]
binding = "TEXTS"
service = "netex-sms"
entrypoint = "Texts"

# Daily summary email through Cloudflare Email Routing (sender: reports@netexcleaners.com).
# Recipients must be verified under Email Routing > Destination addresses.
[[send_email]]
name = "SEND_EMAIL"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true   # the Worker checks the sign-in before any file is served

[[d1_databases]]
binding = "DB"
database_name = "netex-apps"
database_id = "1657081e-9193-4636-a12b-88e0f1f86438"
migrations_dir = "../../db/migrations"

[vars]
ORG_ID = "tcc"
APP_ID = "retail"
ACCOUNT_ID = "61c6ba95bfea0222857214634869b20a"
TIMEZONE = "America/Chicago"
# Same Cloudflare Access application ("Netex apps", *.netexcleaners.com) as the planner: same sign-in, same audience tag
TEAM_DOMAIN = "https://netexcleaners.cloudflareaccess.com"
ACCESS_AUD = "c8867e4f1d945bfb7fc6b393e7f40f0c3bb050846ca416789136186e32e5de57"
ACCESS_GROUP_ID = "2c00c66c-8c20-44bd-95b1-07639add45ab"

# Secrets (Workers > netex-retailview > Settings > Variables and Secrets). Never in GitHub.
#   CF_API_TOKEN  - optional; same token as the planner's, lets Users & access keep the "Netex users" group in step

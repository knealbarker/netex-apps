<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Retail Snapshot</title>
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0f1420">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/retail.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <a class="brand" href="#/snapshot" aria-label="Retail Snapshot home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor" stroke="none"/><path d="M11 23V9h5.6a4.2 4.2 0 0 1 0 8.4H11m5.4 0L21.5 23" fill="none" stroke="var(--bg)" stroke-width="2.8"/></svg>
      <span class="brand-text"><b>Retail Snapshot</b><small id="today"></small></span>
    </a>
    <nav class="tabs" id="nav" aria-label="Sections">
      <a href="#/snapshot" data-view="snapshot"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V9m6 10V5m6 14v-7m4 7H3"/></svg><span>Snapshot</span></a>
      <a href="#/hours" data-view="hours"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg><span>Hours</span></a>
      <a href="#/counter" data-view="counter"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10h18v9H3zM6 10V6h12v4M8 14h3"/></svg><span>Counter</span></a>
      <a href="#/settings" data-view="settings" id="settingsTab" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg><span>Settings</span></a>
    </nav>
    <div class="top-right">
      <a class="applink" href="https://prodplanner.netexcleaners.com" id="plannerLink" hidden>Production Planner ↗</a>
      <div class="menu-wrap">
        <button class="avatar" id="meBtn" aria-haspopup="menu" aria-expanded="false" aria-controls="meMenu" title="Account"></button>
        <div class="menu" id="meMenu" role="menu" hidden>
          <div class="menu-head"><b id="meName"></b><span id="meEmail"></span><span class="chip" id="meRole"></span></div>
          <a role="menuitem" href="#/users" id="usersLink" hidden>Users &amp; access</a>
          <button role="menuitem" id="themeBtn" type="button">Theme: <span id="themeName">System</span></button>
          <a role="menuitem" href="/cdn-cgi/access/logout">Sign out</a>
        </div>
      </div>
    </div>
  </header>
  <main id="main" tabindex="-1"><div class="loading" aria-live="polite"><span class="spin"></span>Loading…</div></main>
  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
  <noscript><p class="noscript">The Retail Snapshot needs JavaScript turned on.</p></noscript>
</body>
</html>

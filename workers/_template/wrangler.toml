# Starter for a new netexcleaners.com app. Copy this folder to workers/<name> and replace every "example".
# This folder itself is not connected to Cloudflare and never deploys. See docs/new-app.md.
name = "netex-example"
main = "src/index.js"
compatibility_date = "2026-09-01"
account_id = "61c6ba95bfea0222857214634869b20a"
workers_dev = false    # only reachable at its own subdomain, behind Cloudflare Access
preview_urls = false

routes = [{ pattern = "example.netexcleaners.com", custom_domain = true }]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true   # the Worker checks the sign-in before any file is served

[[d1_databases]]
binding = "DB"
database_name = "netex-apps"
database_id = "1657081e-9193-4636-a12b-88e0f1f86438"
migrations_dir = "../../db/migrations"   # applied by the planner's deploy only

[vars]
ORG_ID = "tcc"
APP_ID = "example"        # this app's row in core_apps; roles are granted per app
APP_NAME = "Example"
ACCOUNT_ID = "61c6ba95bfea0222857214634869b20a"
TIMEZONE = "America/Chicago"
# Cloudflare Access "Netex apps" (*.netexcleaners.com): same sign-in and audience tag as every other app
TEAM_DOMAIN = "https://netexcleaners.cloudflareaccess.com"
ACCESS_AUD = "c8867e4f1d945bfb7fc6b393e7f40f0c3bb050846ca416789136186e32e5de57"
ACCESS_GROUP_ID = "2c00c66c-8c20-44bd-95b1-07639add45ab"

# Optional: sending email (from reports@netexcleaners.com; recipients verified in Email Routing)
# [[send_email]]
# name = "SEND_EMAIL"

# Optional: a schedule (UTC cron) handled by `scheduled` in src/index.js
# [triggers]
# crons = ["5 * * * *"]

# Secrets (Workers > netex-example > Settings > Variables and Secrets). Never in GitHub.
#   CF_API_TOKEN  - optional; same token as the planner's, lets Users & access keep the "Netex users" Access group in step
